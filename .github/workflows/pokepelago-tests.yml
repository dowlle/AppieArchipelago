name: Pokepelago Tests

on:
  push:
    paths: ['worlds/pokepelago/**']
  pull_request:

jobs:
  # Required status check: runs on every PR so branch protection never waits on a
  # workflow that a path filter skipped. The real job is skipped (reported as
  # passing) when the PR does not touch worlds/pokepelago.
  changes:
    runs-on: ubuntu-latest
    outputs:
      pokepelago: ${{ steps.filter.outputs.pokepelago }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "pokepelago=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- worlds/pokepelago .github/workflows; then
            echo "pokepelago=false" >> "$GITHUB_OUTPUT"
          else
            echo "pokepelago=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.pokepelago == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: Eijebong/ap-actions/ap-tests@main
        with:
          ap-version: '0.6.7'
          python-version: '3.12'
          apworld-path: 'worlds/pokepelago'
